name: Publikasi web

# Inilah yang membuat source dan output "nyambung": begitu ada perubahan di
# app/ yang masuk main, workflow ini membangun ulang web dan menaruh hasilnya
# di root repo — sumber GitHub Pages.
#
# Kenapa commit ke root, bukan branch gh-pages: setting Pages repo ini
# (branch main, folder /root) hanya bisa diubah pemilik repo. Selama belum
# diubah, root main adalah satu-satunya yang tayang.
#
# Kalau langkah "Commit" gagal dengan 403, minta pemilik repo menyetel
# Settings → Actions → General → Workflow permissions ke "Read and write".

# T-42: workflow ini dulu dipicu `push: main` — pemicu yang SAMA dengan ci.yml,
# tanpa hubungan apa pun di antara keduanya. Akibatnya commit yang tesnya merah
# tetap tayang ke publik. Sekarang ia menunggu CI selesai dan hanya jalan kalau
# CI sukses.
on:
  workflow_run:
    workflows: ["CI"] # harus persis sama dengan `name:` di ci.yml
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-web
  cancel-in-progress: false

jobs:
  publish:
    name: Build & commit ke root
    runs-on: ubuntu-latest
    # Jalan kalau CI sukses, atau kalau dijalankan manual untuk rilis darurat.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run selalu checkout commit TERBARU di branch default, yang
          # belum tentu commit yang barusan diuji CI. Tanpa baris ini kita bisa
          # memublikasikan kode yang berbeda dari yang hijau — bug yang sangat
          # sulit dilacak. Untuk dispatch manual, head_sha kosong dan checkout
          # jatuh ke perilaku default (HEAD branch).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          # Harus sama dengan ci.yml — kalau beda, PR bisa hijau tapi rilis gagal.
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Ambil dependensi
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Build web
        working-directory: app
        # Backend situs publik diatur di app/dart_define.pages.json. Berkas itu
        # di-commit, bukan disimpan di repo Variables, karena URL Supabase dan
        # publishable key memang publik (data dijaga Row Level Security). Selama
        # nilainya kosong, situs tayang dengan data contoh.
        run: flutter build web --release --base-href "/catatin/" --dart-define-from-file=dart_define.pages.json

      - name: Sinkron hasil build ke root
        run: bash tool/sync_build.sh

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan output — lewati commit."
            exit 0
          fi
          SUMBER="${{ github.event.workflow_run.head_sha || github.sha }}"
          # Checkout lewat head_sha meninggalkan detached HEAD, dan di situ
          # `git pull` maupun `git push` tanpa argumen menolak jalan ("You are
          # not currently on a branch") — publikasi gagal di setiap merge sejak
          # 21 Sep 2026. Pasang branch lokal dulu, lalu push eksplisit ke main.
          git switch -C publikasi
          git commit -m "build: publikasi web dari ${SUMBER::7} [skip ci]"
          # Dua PR yang digabung berurutan membuat push kedua gagal
          # non-fast-forward, dan publikasi diam-diam tidak jalan. Rebase dulu,
          # lalu coba sekali lagi kalau tetap gagal.
          git pull --rebase origin main
          git push origin HEAD:main || {
            echo "Push ditolak, coba rebase sekali lagi…"
            git pull --rebase origin main
            git push origin HEAD:main
          }
