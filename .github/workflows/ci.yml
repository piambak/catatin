name: CI

# Menjaga agar tiap PR sudah lolos analisis, tes, dan build web sebelum digabung.
on:
  pull_request:
    paths:
      - 'app/**'
      - 'tool/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tool/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Versi yang dipakai memverifikasi repo ini. Kalau dinaikkan,
          # naikkan juga di publish-web.yml supaya CI dan rilis identik.
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Ambil dependensi
        # --enforce-lockfile: versi paket di CI = versi di pubspec.lock yang
        # di-commit, bukan hasil resolusi ulang hari ini (T-9).
        run: flutter pub get --enforce-lockfile

      - name: Analisis statis
        # Info dibiarkan lolos supaya PR kecil tidak tertahan urusan gaya;
        # warning dan error tetap menggagalkan build.
        run: flutter analyze --no-fatal-infos

      - name: Tes
        # --coverage menulis coverage/lcov.info (T-10). Belum ada ambang
        # minimum — angkanya dibuat terlihat dulu, ambang ditetapkan Minggu 7.
        run: flutter test --coverage

      - name: Build web (memastikan rilis tetap bisa dibangun)
        # Konfigurasi yang sama persis dengan publish-web.yml.
        run: flutter build web --release --base-href "/catatin/" --dart-define-from-file=dart_define.pages.json

      - name: Format kode
        # Blocking sejak issue #33 (T-9): PR yang belum diformat gagal di sini.
        # Perbaikannya satu perintah: `cd app && dart format .`
        # Sengaja SESUDAH analisis, tes, dan build, supaya hasil ketiganya tetap
        # kelihatan walau yang kurang hanya format.
        run: dart format --output=none --set-exit-if-changed .

      - name: Skor PRD redesain UI
        # Non-blocking dulu: mencetak angka, tidak menggagalkan build. Tugasnya
        # membuat kemunduran KELIHATAN di setiap PR — audit 12 Sep menemukan dua
        # kriteria yang mundur tanpa disadari karena tidak ada yang mengukur.
        # Jadi blocking (`--strict`) mulai Minggu 3, setelah issue #52 memecah
        # accounting_screen.dart. Lihat wiki/proyek/rencana-frontend.md.
        working-directory: .
        run: |
          {
            echo "## Skor PRD redesain UI"
            echo
            bash tool/prd_score.sh --markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tidak ada kode yatim
        # Blocking: berkas app/lib yang tidak terjangkau dari main.dart dan tidak
        # terdaftar di tool/find_orphans.allow menggagalkan PR (issue #32, T-32).
        # 3.684 baris sempat menumpuk karena tidak ada yang memeriksa.
        working-directory: .
        run: bash tool/find_orphans.sh --strict

      - name: Simpan coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: app/coverage/lcov.info
          retention-days: 14

      - name: Simpan hasil build untuk ditinjau
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: app/build/web
          retention-days: 7
