<!DOCTYPE html>
<html lang="id">
<head>
  <!--
    Nilai base href diisi otomatis oleh `flutter build web --base-href`.
    Untuk GitHub Pages nilainya "/catatin/" (lihat tool/build_web.ps1).
  -->

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catatin — catat transaksi, hitung pajak, dan pahami aturan perpajakan UMKM dalam satu aplikasi.">
  <meta name="theme-color" content="#FFA400">

  <!-- PWA / iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Catatin">

  <meta property="og:type" content="website">

  <title>Catatin</title>
</head>
<body>
  <!--
    Membersihkan service worker lama.

    Sejak build ini aplikasi tidak lagi mendaftarkan service worker (lihat
    web/flutter_bootstrap.js), tapi pengunjung yang pernah membuka versi
    sebelumnya masih menyimpannya di browser. Selama masih terdaftar, ia terus
    menyajikan berkas lama dari cache — termasuk sesudah hard reload.

    Skrip ini membatalkan pendaftarannya, mengosongkan cache-nya, lalu memuat
    ulang SEKALI. Penanda di sessionStorage mencegah putaran reload tak
    berujung. Pengunjung baru tidak terpengaruh: tidak ada yang dibatalkan,
    jadi tidak ada reload.
  -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs.length) return;
        var done = regs.map(function (r) { return r.unregister(); });
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          });
        }
        Promise.all(done).then(function () {
          try {
            if (sessionStorage.getItem('sw-cleared')) return;
            sessionStorage.setItem('sw-cleared', '1');
          } catch (e) {
            return; // sessionStorage diblokir — lebih baik tidak reload sama sekali
          }
          location.reload();
        });
      }).catch(function () {});
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
