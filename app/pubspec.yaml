name: catatin
description: Satu platform untuk catat transaksi, hitung pajak, dan pahami aturan.
publish_to: none

# Naikkan build number tiap rilis web; nilainya ikut ke build/web/version.json.
version: 1.0.0+1

# Batas minimum, bukan versi yang dipakai CI (CI memakai 3.44.8 — lihat
# .github/workflows/ci.yml). fl_chart 1.2.x butuh vector_math ^2.2.0 yang baru
# tersedia sejak Flutter 3.38, jadi SDK lebih tua akan gagal `pub get`.
environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.38.4"

dependencies:
  flutter:
    sdk: flutter

  # ── Jaringan ────────────────────────────────────────────────
  dio: ^5.4.3 # HTTP client
  pretty_dio_logger: ^1.3.1 # log request/response (aktif lewat ENABLE_API_LOG)

  # ── Penyimpanan lokal ───────────────────────────────────────
  flutter_secure_storage: ^10.3.0 # token JWT
  shared_preferences: ^2.2.3 # preferensi & cache ringan

  # ── Navigasi ────────────────────────────────────────────────
  go_router: ^17.2.3

  # ── UI ──────────────────────────────────────────────────────
  fl_chart: ^1.2.0 # grafik dashboard & simulator
  percent_indicator: ^4.2.3 # progress bar ambang PKP
  shimmer: ^3.0.0 # skeleton saat memuat
  intl: ^0.20.2 # format rupiah & tanggal

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Font di-bundle (bukan diunduh saat runtime) supaya aplikasi tetap konsisten
  # saat offline dan tidak menarik permintaan ke domain pihak ketiga.
  # Lihat assets/fonts/README.md untuk lisensinya.
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: DMSerif
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
          weight: 400

  assets:
    - assets/images/
